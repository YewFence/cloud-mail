name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:

jobs:
  # Job 1: Resource Provisioning
  # Checks if resources exist, creates them if missing, and outputs IDs.
  # Skips execution entirely if IDs are already provided in Secrets/Vars.
  provision:
    name: 🛠️ Provision Resources
    runs-on: ubuntu-latest
    outputs:
      kv_id: ${{ steps.set_outputs.outputs.kv_id }}
      d1_id: ${{ steps.set_outputs.outputs.d1_id }}
    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      # Load potential IDs from configuration
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN}}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: ➡️ Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # KV Provisioning Logic
      # ------------------------------------------------------------------
      
      # 1. List KVs (Only if ID is missing)
      - name: 🔍 Check Existing KV
        if: env.KV_NAMESPACE_ID == ''
        id: list_kv
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: kv namespace list
          quiet: false

      # 2. Parse List & Decide (Only if ID is missing)
      - name: 🧠 Process KV Check
        if: env.KV_NAMESPACE_ID == ''
        id: parse_kv
        shell: bash
        env:
          KV_JSON: ${{ steps.list_kv.outputs.command-output }}
        run: |
          # Try to find ID by name (using --arg for safe variable passing)
          EXISTING_ID=$(echo "$KV_JSON" | jq -r --arg name "$NAME" '.[] | select(.title == $name) | .id')

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "::notice::✅ Found existing KV: $EXISTING_ID. ℹ️You can now set KV_NAMESPACE_ID to this value in Secrets/Vars to skip provisioning in future runs."
            # Use a fresh variable name to avoid GitHub secret masking
            echo "RESOLVED_KV_ID=$EXISTING_ID" >> $GITHUB_ENV
            echo "need_create=false" >> $GITHUB_OUTPUT
          else
            echo "::warn::⚠️ KV not found. Need creation."
            echo "need_create=true" >> $GITHUB_OUTPUT
          fi

      # 3. Create KV (Only if needed)
      - name: 🔨 Create KV
        if: env.KV_NAMESPACE_ID == '' && steps.parse_kv.outputs.need_create == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: kv namespace create "${{ env.NAME }}"

      # 4. Get New KV ID (Only if created)
      # Re-listing is safer than parsing creation output which format might change
      - name: 🔄 Get New KV ID
        if: env.KV_NAMESPACE_ID == '' && steps.parse_kv.outputs.need_create == 'true'
        id: list_kv_new
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: kv namespace list

      - name: 📥 Capture New KV ID
        if: env.KV_NAMESPACE_ID == '' && steps.parse_kv.outputs.need_create == 'true'
        shell: bash
        env:
          KV_JSON: ${{ steps.list_kv_new.outputs.command-output }}
        run: |
          NEW_ID=$(echo "$KV_JSON" | jq -r --arg name "$NAME" '.[] | select(.title == $name) | .id')
          if [ -z "$NEW_ID" ] || [ "$NEW_ID" == "null" ]; then
            echo "::error::❌ Failed to retrieve newly created KV namespace ID"
            exit 1
          fi
          echo "::notice::✅ Created KV ID: $NEW_ID. ℹ️You can now set KV_NAMESPACE_ID to this value in Secrets/Vars to skip provisioning in future runs."
          # Use a fresh variable name to avoid GitHub secret masking
          echo "RESOLVED_KV_ID=$NEW_ID" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # D1 Provisioning Logic
      # ------------------------------------------------------------------

      # 1. List D1s (Only if ID is missing)
      - name: 🔍 Check Existing D1
        if: env.D1_DATABASE_ID == ''
        id: list_d1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 list --json
          quiet: false

      # 2. Parse List & Decide (Only if ID is missing)
      - name: 🧠 Process D1 Check
        if: env.D1_DATABASE_ID == ''
        id: parse_d1
        shell: bash
        env:
          DB_JSON: ${{ steps.list_d1.outputs.command-output }}
        run: |
          # Try to find ID by name (using --arg for safe variable passing)
          EXISTING_ID=$(echo "$DB_JSON" | jq -r --arg name "$NAME" '.[] | select(.name == $name) | .uuid')

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "::notice::✅ Found existing D1: $EXISTING_ID. ℹ️You can now set D1_DATABASE_ID to this value in Secrets/Vars to skip provisioning in future runs."
            # Use a fresh variable name to avoid GitHub secret masking
            echo "RESOLVED_D1_ID=$EXISTING_ID" >> $GITHUB_ENV
            echo "need_create=false" >> $GITHUB_OUTPUT
          else
            echo "::warn::⚠️ D1 not found. Need creation."
            echo "need_create=true" >> $GITHUB_OUTPUT
          fi

      # 3. Create D1 (Only if needed)
      - name: 🔨 Create D1
        if: env.D1_DATABASE_ID == '' && steps.parse_d1.outputs.need_create == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 create "${{ env.NAME }}"

      # 4. Get New D1 ID (Only if created)
      - name: 🔄 Get New D1 ID
        if: env.D1_DATABASE_ID == '' && steps.parse_d1.outputs.need_create == 'true'
        id: list_d1_new
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 list --json

      - name: 📥 Capture New D1 ID
        if: env.D1_DATABASE_ID == '' && steps.parse_d1.outputs.need_create == 'true'
        shell: bash
        env:
          DB_JSON: ${{ steps.list_d1_new.outputs.command-output }}
        run: |
          NEW_ID=$(echo "$DB_JSON" | jq -r --arg name "$NAME" '.[] | select(.name == $name) | .uuid')
          if [ -z "$NEW_ID" ] || [ "$NEW_ID" == "null" ]; then
            echo "::error::❌ Failed to retrieve newly created D1 database ID"
            exit 1
          fi
          echo "::notice::✅ Created D1 ID: $NEW_ID. ℹ️You can now set D1_DATABASE_ID to this value in Secrets/Vars to skip provisioning in future runs."
          # Use a fresh variable name to avoid GitHub secret masking
          echo "RESOLVED_D1_ID=$NEW_ID" >> $GITHUB_ENV

      # Final Output Step - always output RESOLVED_* IDs (won't be masked since they're fresh variables)
      - name: 📤 Export IDs
        id: set_outputs
        run: |
          if [ -z "$RESOLVED_KV_ID" ]; then
            echo "::notice:: Using KV ID from Github Actions Secrets/Vars, skipping provisioning."
          fi
          if [ -z "$RESOLVED_D1_ID" ]; then
            echo "::notice:: Using D1 ID from Github Actions Secrets/Vars, skipping provisioning."
          fi
          # whatever the case, output the resolved IDs. If they were provided, these outputs will be empty
          # but that's okay since the deploy job uses Secrets/Vars as fallback.
          echo "kv_id=$RESOLVED_KV_ID" >> $GITHUB_OUTPUT
          echo "d1_id=$RESOLVED_D1_ID" >> $GITHUB_OUTPUT

  # Job 2: Build & Deploy
  deploy:
    name: 🏗️ Build & Deploy
    needs: provision
    runs-on: ubuntu-latest
    env:
      # Use IDs: prefer provision job outputs, fallback to secrets/vars
      # Note: GitHub masks outputs that match secrets, so we need fallback
      KV_NAMESPACE_ID: ${{ needs.provision.outputs.kv_id || secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      D1_DATABASE_ID: ${{ needs.provision.outputs.d1_id || secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      
      # Standard Vars
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN}}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN}}
      JWT_SECRET: ${{ secrets.JWT_SECRET}}
      LINUXDO_CLIENT_ID: ${{ secrets.LINUXDO_CLIENT_ID || vars.LINUXDO_CLIENT_ID }}
      LINUXDO_CLIENT_SECRET: ${{ secrets.LINUXDO_CLIENT_SECRET}}
      LINUXDO_CALLBACK_URL: ${{ secrets.LINUXDO_CALLBACK_URL || vars.LINUXDO_CALLBACK_URL}}
      LINUXDO_SWITCH: ${{ secrets.LINUXDO_SWITCH || vars.LINUXDO_SWITCH }}

    outputs:
      deployment_skipped: ${{ steps.render.outputs.deployment_skipped }}

    steps:
      - name: ➡️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: latest

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: 📥 Install dependencies (Worker)
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: 📥 Install dependencies (Vue)
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-vue

      - name: 🏗️ Build Frontend
        run: pnpm run build
        working-directory: ./mail-vue

      - name : "🔍 Validate Configuration"
        run: |
          echo "🔍 Configuration Check..."
          
          # Basic Validation
          if [ -z "$ADMIN" ] || [ -z "$JWT_SECRET" ]; then
            echo "::error::❌ ADMIN and JWT_SECRET are required."
            exit 1
          fi
          
          if grep -q '[?%#/\\]' <<< "$JWT_SECRET"; then
            echo "::error::❌ JWT_SECRET contains invalid characters."
            exit 1
          fi

          if [ -z "$DOMAIN" ]; then
            echo "::error::❌ DOMAIN is required."
            exit 1
          fi

          if ! jq -e 'type == "array"' <<< "$DOMAIN" >/dev/null 2>&1; then
            echo "::error::❌ DOMAIN must be a JSON array (e.g. [\"example.com\"])."
            exit 1
          fi

      - name: 🛠️ Render Config
        id: render
        working-directory: ./mail-worker
        run: |
          echo "deployment_skipped=false" >> $GITHUB_OUTPUT
          CONFIG_FILE="wrangler.generated.toml"
          
          # Copy & Replace
          cp "wrangler-action.toml" "$CONFIG_FILE"
          sed -i 's/"\${DOMAIN}"/${DOMAIN}/g' "$CONFIG_FILE"
          
          # Envsubst (IDs from provision job are automatically available in env)
          envsubst < "$CONFIG_FILE" > temp.toml && mv temp.toml "$CONFIG_FILE"

          # Optional Features Cleanup (using sed/awk since yq doesn't support TOML output)
          # NOTE: The patterns below depend on the structure of wrangler-action.toml template.
          #       If the template changes, these patterns may need to be updated accordingly.
          if [ -z "$R2_BUCKET_NAME" ]; then
            echo "::notice::R2_BUCKET_NAME not set, disabling R2 integration."
            # Remove entire [[r2_buckets]] block (handles EOF case with awk)
            awk '/^\[\[r2_buckets\]\]/{skip=1;next} /^\[/{skip=0} !skip' "$CONFIG_FILE" > temp.toml && mv temp.toml "$CONFIG_FILE"
          fi

          # Validation
          if ! yq -p=toml '.' "$CONFIG_FILE" > /dev/null 2>&1; then
            echo "::error::❌ Generated TOML is invalid. Please check the configuration."
            echo "deployment_skipped=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Config generated."
          echo "Using KV: $KV_NAMESPACE_ID"
          echo "Using D1: $D1_DATABASE_ID"

      - name: 🚀 Deploy
        id: deploy
        if: ${{ steps.render.outputs.deployment_skipped == 'false' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./mail-worker
          command: deploy -c wrangler.generated.toml
          secrets: |
            admin
            jwt_secret
            linuxdo_client_secret
        env:
          admin: ${{ env.ADMIN }}
          jwt_secret: ${{ env.JWT_SECRET }}
          linuxdo_client_secret: ${{ env.LINUXDO_CLIENT_SECRET }}

      - name: 🗄️ D1 Migrations
        if: ${{ steps.render.outputs.deployment_skipped == 'false' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./mail-worker
          command: d1 migrations apply ${{ env.NAME }} --remote --config wrangler.generated.toml

      - name: 📣 Final Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ] && [ "${{ steps.render.outputs.deployment_skipped }}" != "true" ]; then
             echo "::notice::🎉 Deployment Success!"
          else
             echo "::error::❌ Deployment Failed."
             exit 1
          fi
