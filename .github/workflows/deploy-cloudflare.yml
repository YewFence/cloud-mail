name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:
jobs:
  deploy:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest
    env:
      # Use IDs: prefer provision job outputs, fallback to secrets/vars
      # Note: GitHub masks outputs that match secrets, so we need fallback
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      
      # Standard Vars
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN}}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN}}
      JWT_SECRET: ${{ secrets.JWT_SECRET}}
      LINUXDO_CLIENT_ID: ${{ secrets.LINUXDO_CLIENT_ID || vars.LINUXDO_CLIENT_ID }}
      LINUXDO_CLIENT_SECRET: ${{ secrets.LINUXDO_CLIENT_SECRET}}
      LINUXDO_CALLBACK_URL: ${{ secrets.LINUXDO_CALLBACK_URL || vars.LINUXDO_CALLBACK_URL}}
      LINUXDO_SWITCH: ${{ secrets.LINUXDO_SWITCH || vars.LINUXDO_SWITCH }}

    outputs:
      deployment_skipped: ${{ steps.render.outputs.deployment_skipped }}

    steps:
      - name: ➡️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: latest

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: 📥 Install dependencies (Worker)
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: 📥 Install dependencies (Vue)
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-vue

      - name: 🏗️ Build Frontend
        run: pnpm run build
        working-directory: ./mail-vue

      - name : "🔍 Validate Configuration"
        run: |
          echo "🔍 Configuration Check..."
          
          # Basic Validation
          if [ -z "$ADMIN" ] || [ -z "$JWT_SECRET" ]; then
            echo "::error::❌ ADMIN and JWT_SECRET are required."
            exit 1
          fi
          
          if grep -q '[?%#/\\]' <<< "$JWT_SECRET"; then
            echo "::error::❌ JWT_SECRET contains invalid characters."
            exit 1
          fi

          if [ -z "$DOMAIN" ]; then
            echo "::error::❌ DOMAIN is required."
            exit 1
          fi

          if [ -z "${KV_NAMESPACE_ID}" ] || [ -z "${D1_DATABASE_ID}" ]; then
            echo "::error::❌ KV_NAMESPACE_ID and D1_DATABASE_ID must be set."
            exit 1
          fi

          if ! jq -e 'type == "array"' <<< "$DOMAIN" >/dev/null 2>&1; then
            echo "::error::❌ DOMAIN must be a JSON array (e.g. [\"example.com\"])."
            exit 1
          fi

      - name: 🛠️ Render Config
        id: render
        working-directory: ./mail-worker
        run: |
          echo "deployment_skipped=false" >> $GITHUB_OUTPUT
          CONFIG_FILE="wrangler.generated.toml"
          
          # Copy & Replace
          cp "wrangler-action.toml" "$CONFIG_FILE"
          sed -i 's/"\${DOMAIN}"/${DOMAIN}/g' "$CONFIG_FILE"
          
          # Envsubst (IDs from provision job are automatically available in env)
          envsubst < "$CONFIG_FILE" > temp.toml && mv temp.toml "$CONFIG_FILE"

          # Optional Features Cleanup (using sed/awk since yq doesn't support TOML output)
          # NOTE: The patterns below depend on the structure of wrangler-action.toml template.
          #       If the template changes, these patterns may need to be updated accordingly.
          if [ -z "$R2_BUCKET_NAME" ]; then
            echo "::notice::R2_BUCKET_NAME not set, disabling R2 integration."
            # Remove entire [[r2_buckets]] block (handles EOF case with awk)
            awk '/^\[\[r2_buckets\]\]/{skip=1;next} /^\[/{skip=0} !skip' "$CONFIG_FILE" > temp.toml && mv temp.toml "$CONFIG_FILE"
          fi

          # Validation
          if ! yq -p=toml '.' "$CONFIG_FILE" > /dev/null 2>&1; then
            echo "::error::❌ Generated TOML is invalid. Please check the configuration."
            echo "deployment_skipped=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Config generated."
          echo "Using KV: $KV_NAMESPACE_ID"
          echo "Using D1: $D1_DATABASE_ID"

      - name: 🚀 Deploy
        id: deploy
        if: ${{ steps.render.outputs.deployment_skipped == 'false' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./mail-worker
          command: deploy -c wrangler.generated.toml
          secrets: |
            admin
            jwt_secret
            linuxdo_client_secret
        env:
          admin: ${{ env.ADMIN }}
          jwt_secret: ${{ env.JWT_SECRET }}
          linuxdo_client_secret: ${{ env.LINUXDO_CLIENT_SECRET }}

      - name: 🗄️ D1 Migrations
        if: ${{ steps.render.outputs.deployment_skipped == 'false' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./mail-worker
          command: d1 migrations apply ${{ env.NAME }} --remote --config wrangler.generated.toml

      - name: 📣 Final Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ] && [ "${{ steps.render.outputs.deployment_skipped }}" != "true" ]; then
             echo "::notice::🎉 Deployment Success!"
          else
             echo "::error::❌ Deployment Failed."
             exit 1
          fi
