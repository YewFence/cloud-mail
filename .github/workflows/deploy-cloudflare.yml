name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:

jobs:
  Deploy-cloud-mail:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      DOMAIN: ${{ secrets.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LINUXDO_CLIENT_ID: ${{ secrets.LINUXDO_CLIENT_ID }}
      LINUXDO_CLIENT_SECRET: ${{ secrets.LINUXDO_CLIENT_SECRET }}
      LINUXDO_CALLBACK_URL: ${{ secrets.LINUXDO_CALLBACK_URL }}
      LINUXDO_SWITCH: ${{ secrets.LINUXDO_SWITCH }}

    outputs:
      deployment_skipped: ${{ steps.render.outputs.deployment_skipped }}
      worker_url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: ➡️ 检出代码仓库 - Checkout repository
        uses: actions/checkout@v4

      - name: 📦 设置 pnpm - Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: latest

      - name: 📦 设置 Node.js - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: 📥 安装依赖 - Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: 🛠️ 设置环境变量 - Render Config
        id: render
        working-directory: ./mail-worker
        run: |
          if [ -z "$D1_DATABASE_ID" ] || [ -z "$KV_NAMESPACE_ID" ]; then
            echo "⚠️ Required secrets (D1_DATABASE_ID or KV_NAMESPACE_ID) are not set."
            echo "❌ Skipping deployment."
            echo "deployment_skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "deployment_skipped=false" >> $GITHUB_OUTPUT
          
          CONFIG_TEMPLATE="wrangler-action.toml"
          CONFIG_FILE="wrangler.generated.toml"

          echo "⚙️ 渲染配置文件..."
          
          # 1. 复制模板，只对 DOMAIN 去掉引号（因为它可能是数组）
          cp "$CONFIG_TEMPLATE" "$CONFIG_FILE"
          sed -i 's/"\${DOMAIN}"/${DOMAIN}/g' "$CONFIG_FILE"
          
          # 2. 使用 envsubst 一次性替换所有环境变量
          envsubst < "$CONFIG_FILE" > temp.toml && mv temp.toml "$CONFIG_FILE"

          # 3. 如果没有 R2，删除配置块
          if [ -z "$R2_BUCKET_NAME" ]; then
            yq -i -p=toml -o=toml 'del(.r2_buckets)' "$CONFIG_FILE"
          fi

          # 4. 验证 TOML 语法
          if ! yq -p=toml '.' "$CONFIG_FILE" > /dev/null 2>&1; then
            echo "❌ TOML 语法错误，跳过部署"
            echo "deployment_skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔍 Debug: Checking configuration after rendering..."
          echo "R2_BUCKET_NAME value: '$R2_BUCKET_NAME'"
          echo "DOMAIN value: '$DOMAIN'"

      - name: 🚀 部署 - Deploy
        id: deploy
        if: ${{ steps.render.outputs.deployment_skipped == 'false' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./mail-worker
          command: deploy -c wrangler.generated.toml

      - name: 🗄️ 数据库迁移 - Apply D1 Migrations
        if: ${{ steps.render.outputs.deployment_skipped == 'false' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./mail-worker
          command: d1 migrations apply cloud-mail --remote --config wrangler.generated.toml

      - name: 📣 部署状态 - Notify Final Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            if [ "${{ steps.render.outputs.deployment_skipped }}" == "true" ]; then
              echo "❌ Deployment was skipped due to missing configuration."
              exit 1
            else
              echo "🎉🎉🎉 Hooray! Deployment completed successfully! 🎉🎉🎉"
            fi
          else
            echo "❌❌❌ Oh no! The deployment failed. Please check the logs above for errors. ❌❌❌"
            exit 1
          fi

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: '3'
          keep_minimum_runs: '0'
