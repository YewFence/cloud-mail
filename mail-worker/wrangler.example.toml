name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

#[[d1_databases]]
#binding = "db"			#d1数据库绑定名默认不可修改
#database_name = ""		#d1数据库名字
#database_id = ""		#d1数据库id

#[[kv_namespaces]]
#binding = "kv"			#kv绑定名默认不可修改
#id = ""					#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#定时任务每天晚上12点执行


#[vars]
#orm_log = false
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""				#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串

# LinuxDo OAuth 配置（可选，默认禁用）
# 警告：此功能存在已知安全限制，仅在了解风险的情况下启用
# 详见：https://github.com/YewFence/cloud-mail/blob/main/README.md#github-actions-部署教程wrangler-action
#linuxdo_client_id = ""			# LinuxDo OAuth Client ID
#linuxdo_client_secret = ""		# LinuxDo OAuth Client Secret
#linuxdo_callback_url = ""		# 回调地址，示例: https://yourdomain.com
#linuxdo_switch = "false"			# 是否启用 LinuxDo 登录按钮（"true" 或 "false"）

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
